<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Review</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --card:#fff; --line:#ddd; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8e8e8; --muted:#9aa0a6; --card:#1d2026; --line:#333; --accent:#6c97ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width:900px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1 1 200px; }
  select, textarea, input[type=text] { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px;
         background:var(--bg); color:var(--fg); font:inherit; }
  textarea { font-family:ui-monospace, Menlo, monospace; font-size:13px; min-height:120px; resize:vertical; }
  button { padding:9px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit;
           font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #status { color:var(--muted); margin-left:12px; }
    #result h2 { font-size:16px; margin:20px 0 8px; }
  #result h2:first-child { margin-top:0; }
  .item { border:1px solid var(--line); border-left-width:4px; border-radius:6px; padding:10px 12px; margin-bottom:8px; }
  .item.good { border-left-color:#2e9e5b; }
  .item.High { border-left-color:#d93636; } .item.Medium { border-left-color:#e0a000; } .item.Low { border-left-color:#6c8ebf; }
  .item .t { font-weight:600; }
  .item .loc { font-family:ui-monospace, Menlo, monospace; font-size:12px; color:var(--muted); }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px;
         border:1px solid var(--line); margin-right:6px; }
  table.crit { border-collapse:collapse; width:100%; font-size:13px; }
  table.crit td { border:1px solid var(--line); padding:4px 8px; }
  .Yes { color:#2e9e5b; } .No { color:#d93636; }
  .hint { color:var(--muted); font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>Local AI Review</h1>
  <p class="sub">Runs entirely on this computer through Ollama. No code is sent to the internet.</p>

  <div class="card">
    <div class="row">
      <div><label for="model">Model</label><select id="model"></select></div>
      <div><label for="lang">Answer language</label>
        <select id="lang">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="zh-Hant">繁體中文</option>
        </select></div>
    </div>
    <div class="hint" id="modelHint"></div>
  </div>

  <div class="card">
    <label for="req">Requirements (what the code is supposed to do)</label>
    <textarea id="req" placeholder="Paste the requirements here"></textarea>
  </div>

  <div class="card">
    <label>Code to review</label>
    <input type="file" id="folder" webkitdirectory multiple>
    <div class="hint" id="folderInfo">Pick a folder, or paste a single file below.</div>
    <div style="height:10px"></div>
    <input type="text" id="pasteName" value="pasted-code.txt" aria-label="File name for pasted code">
    <div style="height:6px"></div>
    <textarea id="paste" placeholder="Or paste code here"></textarea>
  </div>

  <div style="margin-bottom:16px">
    <button id="go">Review</button>
    <button id="stop" class="ghost" disabled>Stop</button>
    <button id="copy" class="ghost" disabled>Copy JSON</button>
    <span id="status"></span>
  </div>

  <div class="card"><div id="result" aria-live="polite">The result appears here.</div></div>
</main>

<script>
const $ = id => document.getElementById(id);
const SKIP_DIR = /(^|\/)(\.git|node_modules|dist|build|\.next|venv|\.venv|__pycache__)\//;
const SECRET = /(^|\/)(\.env(\..*)?|.*\.(pem|key|p12|pfx)|id_rsa.*|id_ed25519.*)$/;
const MAX_FILE = 200 * 1024;
let files = [];
let abort = null;

async function loadModels() {
  try {
    const r = await fetch('/api/models');
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    $('model').innerHTML = j.models.map(m => `<option>${m}</option>`).join('');
    $('modelHint').textContent = j.models.length ? '' :
      'No model installed yet. Run: ollama pull qwen2.5-coder:7b';
  } catch (e) {
    $('modelHint').textContent = e.message;
  }
}

$('folder').addEventListener('change', async e => {
  files = [];
  let skipped = 0;
  for (const f of e.target.files) {
    const p = f.webkitRelativePath.split('/').slice(1).join('/');
    if (SKIP_DIR.test('/' + p)) { skipped++; continue; }
    if (SECRET.test(p)) { files.push({ path: p, content: '(secret file — contents not sent)' }); continue; }
    if (f.size > MAX_FILE) { skipped++; continue; }
    const text = await f.text();
    if (text.includes('\u0000')) { skipped++; continue; }
    files.push({ path: p, content: text });
  }
  $('folderInfo').textContent = `${files.length} files loaded, ${skipped} skipped (binary, large or generated).`;
});

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // model output is untrusted: never innerHTML
  return e;
};
let lastResult = null;

function item(cls, x, tag) {
  const d = el('div', 'item ' + cls);
  const t = el('div', 't');
  if (tag) t.append(el('span', 'tag', tag));
  t.append(x.title);
  d.append(t, el('div', '', x.detail));
  if (x.location) d.append(el('div', 'loc', x.location));
  return d;
}

function render(r) {
  const box = $('result');
  box.replaceChildren();
  box.append(el('h2', '', 'Summary'), el('div', '', r.summary));
  box.append(el('h2', '', `Strengths (${r.strengths.length})`));
  r.strengths.forEach(x => box.append(item('good', x)));
  if (!r.strengths.length) box.append(el('div', 'hint', 'None reported.'));
  box.append(el('h2', '', `Weaknesses (${r.weaknesses.length})`));
  const order = { High: 0, Medium: 1, Low: 2 };
  r.weaknesses.slice().sort((a, b) => order[a.severity] - order[b.severity])
    .forEach(x => box.append(item(x.severity, x, `${x.severity} · ${x.criterion}`)));
  if (!r.weaknesses.length) box.append(el('div', 'hint', 'None reported.'));
  if (r.criteria.length) {
    box.append(el('h2', '', 'Checklist'));
    const tb = el('table', 'crit');
    r.criteria.forEach(c => {
      const tr = el('tr'), ans = el('td', c.answer.split(' ')[0], c.answer);
      tr.append(el('td', '', c.code), ans);
      tb.append(tr);
    });
    box.append(tb);
  }
  if (r.open_questions.length) {
    box.append(el('h2', '', 'Open questions'));
    r.open_questions.forEach(q => box.append(el('div', '', '• ' + q)));
  }
}

$('go').onclick = async () => {
  const list = files.slice();
  if ($('paste').value.trim()) list.push({ path: $('pasteName').value || 'pasted-code.txt', content: $('paste').value });
  if (!list.length) { $('status').textContent = 'Add some code first.'; return; }
  $('result').textContent = '';
  lastResult = null; $('copy').disabled = true;
  $('status').textContent = 'Thinking… (a local model can take a few minutes)';
  $('go').disabled = true; $('stop').disabled = false;
  abort = new AbortController();
  const t0 = Date.now();
  const handle = ev => {
    if (ev.type === 'progress') $('status').textContent = `Writing review… ${ev.chars} characters`;
    else if (ev.type === 'retry') $('status').textContent = 'Invalid answer from the model, retrying once…';
    else if (ev.type === 'result') {
      lastResult = ev.data; render(ev.data); $('copy').disabled = false;
      $('status').textContent = `Done in ${Math.round((Date.now() - t0) / 1000)} s`;
    } else if (ev.type === 'error') {
      $('status').textContent = 'Error: ' + ev.message;
    }
  };
  try {
    const r = await fetch('/api/review', {
      method: 'POST', signal: abort.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: $('model').value, lang: $('lang').value,
                             requirements: $('req').value, files: list })
    });
    if (!r.ok) throw new Error((await r.json()).error);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      lines.filter(Boolean).forEach(l => handle(JSON.parse(l)));
    }
  } catch (e) {
    $('status').textContent = e.name === 'AbortError' ? 'Stopped.' : 'Error: ' + e.message;
  } finally {
    $('go').disabled = false; $('stop').disabled = true;
  }
};
$('stop').onclick = () => abort && abort.abort();
$('copy').onclick = () => lastResult && navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2));
loadModels();
</script>
</body>
</html>
